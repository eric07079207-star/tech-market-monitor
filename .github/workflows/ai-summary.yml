name: Generate AI summary

on:
  schedule:
    # Retry after 07:00 Asia/Taipei so one missed cron does not skip the daily summary.
    - cron: "5 23 * * *"
    - cron: "5 0 * * *"
    - cron: "5 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate the daily summary even when one already exists"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/ai-summary.yml"

concurrency:
  group: tech-market-monitor-cache-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-ai-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily AI summary if needed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          FORCE_SUMMARY: ${{ github.event.inputs.force || 'false' }}
        run: |
          if [ "$FORCE_SUMMARY" = "true" ]; then
            python scripts/generate_ai_summary_if_needed.py --force
          else
            python scripts/generate_ai_summary_if_needed.py
          fi

      - name: Export observation data
        run: python scripts/export_observation_data.py

      - name: Refresh project memory Word summary
        run: python scripts/build_project_memory_doc.py

      - name: Smoke check app
        run: python scripts/smoke_check.py

      - name: Commit updated summary cache
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/ai_summary.json data/cache/ai_summary_history.parquet data/觀察版資料/08_AI摘要 data/觀察版資料/13_專案記憶
          git diff --cached --quiet && exit 0
          git commit -m "Update AI summary cache"
          # Generated auxiliary files must not block rebasing the committed cache.
          git stash push --include-untracked --message "post-summary-cache-commit" || true
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "AI summary cache could not be pushed after 3 attempts."
          exit 1
