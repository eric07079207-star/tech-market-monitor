name: Update market data

on:
  schedule:
    # Refresh every 6 hours so Streamlit Cloud can pick up fresh market/news cache.
    - cron: "0 */6 * * *"
    # Generate one AI summary daily at 07:00 Asia/Taipei.
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: tech-market-monitor-cache-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh cached data
        id: refresh_data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_data.py

      - name: Install LSTM dependencies
        if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
        run: pip install "torch>=2.3"

      - name: Train LSTM model
        if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/train_lstm.py

      - name: Train TSLA specialist LSTM model
        if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
        env:
          LSTM_ARTIFACT_SUBDIR: tsla_specialist
        run: python scripts/train_lstm.py --symbols TSLA

      - name: Generate daily AI summary if needed
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/generate_ai_summary_if_needed.py

      - name: Evaluate prediction quality
        if: always()
        run: python scripts/evaluate_prediction_quality.py

      - name: Export observation data
        if: always()
        run: python scripts/export_observation_data.py

      - name: Refresh project memory Word summary
        if: always()
        run: python scripts/build_project_memory_doc.py

      - name: Smoke check app
        if: always()
        run: python scripts/smoke_check.py

      - name: Commit updated cache
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The dashboard only needs compact inference/evaluation artifacts.
          # Training sequences and split tables are reproducible intermediate
          # files; committing them duplicates tens of MB in cache and exports.
          git add data/cache data/觀察版資料
          heavy_lstm_artifacts=(
            data/cache/lstm/lstm_features.parquet
            data/cache/lstm/lstm_train_features.parquet
            data/cache/lstm/lstm_split.parquet
            data/cache/lstm/lstm_monitor_features.parquet
            data/cache/lstm/tsla_specialist/lstm_features.parquet
            data/cache/lstm/tsla_specialist/lstm_train_features.parquet
            data/cache/lstm/tsla_specialist/lstm_split.parquet
            data/cache/lstm/tsla_specialist/lstm_monitor_features.parquet
            data/觀察版資料/10_LSTM模型/lstm/lstm_features.parquet
            data/觀察版資料/10_LSTM模型/lstm/lstm_train_features.parquet
            data/觀察版資料/10_LSTM模型/lstm/lstm_split.parquet
            data/觀察版資料/10_LSTM模型/lstm/lstm_monitor_features.parquet
            data/觀察版資料/10_LSTM模型/lstm_features.csv
            data/觀察版資料/10_LSTM模型/lstm_train_features.csv
            data/觀察版資料/10_LSTM模型/lstm_split.csv
            data/觀察版資料/10_LSTM模型/lstm_monitor_features.csv
          )
          for artifact in "${heavy_lstm_artifacts[@]}"; do
            git reset -q -- "$artifact" 2>/dev/null || true
          done

          git diff --cached --quiet && exit 0

          staged_bytes=$(
            git diff --cached --name-only --diff-filter=ACMRTUXB -z |
              xargs -0 -r du -cb |
              tail -1 |
              cut -f1
          )
          staged_bytes=${staged_bytes:-0}
          max_staged_bytes=$((40 * 1024 * 1024))
          if (( staged_bytes > max_staged_bytes )); then
            echo "Refusing to publish a cache commit larger than 40 MB (${staged_bytes} bytes)."
            git diff --cached --name-only --diff-filter=ACMRTUXB -z |
              xargs -0 -r du -h |
              sort -h |
              tail -20
            exit 1
          fi

          git commit -m "Update market data cache"
          for attempt in 1 2 3; do
            # Reproducible training tables stay uncommitted by design. Autostash
            # them while rebasing so concurrent cache jobs can still synchronize.
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Cache update could not be pushed after 3 attempts."
          exit 1
