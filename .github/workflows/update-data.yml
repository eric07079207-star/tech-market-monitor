name: Update market data

on:
  schedule:
    # 22:30 UTC is after the regular US market close in both EST and EDT.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh cached data
        run: python scripts/update_data.py

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/prices.parquet data/cache/macro.parquet data/cache/news.parquet data/cache/metadata.json
          git diff --cached --quiet && exit 0
          git commit -m "Update market data cache"
          git push
