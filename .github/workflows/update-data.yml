name: Update market data

on:
  schedule:
    # Refresh every 6 hours so Streamlit Cloud can pick up fresh market/news cache.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh cached data
        run: python scripts/update_data.py

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/prices.parquet data/cache/macro.parquet data/cache/news.parquet data/cache/international_news.parquet data/cache/discovery_news.parquet data/cache/discovery_mentions.parquet data/cache/discovery_candidates.parquet data/cache/discovery_history.parquet data/cache/prediction_log.csv data/cache/metadata.json
          git diff --cached --quiet && exit 0
          git commit -m "Update market data cache"
          git push
