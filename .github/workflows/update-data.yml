name: Update market data

on:
  push:
    paths:
      - ".github/workflows/update-data.yml"
  schedule:
    # Refresh every 6 hours so Streamlit Cloud can pick up fresh market/news cache.
    - cron: "0 */6 * * *"
    # Generate one AI summary daily at 07:00 Asia/Taipei.
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: tech-market-monitor-cache-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh cached data
        id: refresh_data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_data.py

      - name: Install LSTM dependencies
        if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
        run: pip install "torch>=2.3"

      - name: Train LSTM model
        if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/train_lstm.py

      - name: Train TSLA specialist LSTM model
        if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
        env:
          LSTM_ARTIFACT_SUBDIR: tsla_specialist
        run: python scripts/train_lstm.py --symbols TSLA

      - name: Generate daily AI summary if needed
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/generate_ai_summary_if_needed.py

      - name: Evaluate prediction quality
        if: always()
        run: python scripts/evaluate_prediction_quality.py

      - name: Export observation data
        if: always()
        run: python scripts/export_observation_data.py

      - name: Refresh project memory Word summary
        if: always()
        run: python scripts/build_project_memory_doc.py

      - name: Smoke check app
        if: always()
        run: python scripts/smoke_check.py

      - name: Commit updated cache
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The dashboard only needs compact inference/evaluation artifacts.
          # Training sequences and split tables are reproducible intermediate
          # files; committing them duplicates tens of MB in cache and exports.
          git add data/cache data/觀察版資料
          heavy_lstm_artifacts=(
            data/cache/lstm/lstm_features.parquet
            data/cache/lstm/lstm_train_features.parquet
            data/cache/lstm/lstm_split.parquet
            data/cache/lstm/lstm_monitor_features.parquet
            data/cache/lstm/tsla_specialist/lstm_features.parquet
            data/cache/lstm/tsla_specialist/lstm_train_features.parquet
            data/cache/lstm/tsla_specialist/lstm_split.parquet
            data/cache/lstm/tsla_specialist/lstm_monitor_features.parquet
            data/觀察版資料/10_LSTM模型/lstm/lstm_features.parquet
            data/觀察版資料/10_LSTM模型/lstm/lstm_train_features.parquet
            data/觀察版資料/10_LSTM模型/lstm/lstm_split.parquet
            data/觀察版資料/10_LSTM模型/lstm/lstm_monitor_features.parquet
            data/觀察版資料/10_LSTM模型/lstm_features.csv
            data/觀察版資料/10_LSTM模型/lstm_train_features.csv
            data/觀察版資料/10_LSTM模型/lstm_split.csv
            data/觀察版資料/10_LSTM模型/lstm_monitor_features.csv
          )
          for artifact in "${heavy_lstm_artifacts[@]}"; do
            git reset -q -- "$artifact" 2>/dev/null || true
          done

          git diff --cached --quiet && exit 0

          max_staged_bytes=$((40 * 1024 * 1024))
          mapfile -d '' staged_files < <(
            git diff --cached --name-only --diff-filter=ACDMRTUXB -z
          )
          git reset -q

          # Keep the 40 MB safety limit, but split a large refresh into compact
          # commits instead of discarding an otherwise successful data run.
          batch_bytes=0
          batch_index=1
          batch_file_count=0
          commit_batch() {
            if (( batch_file_count == 0 )); then
              return
            fi
            git commit -m "Update market data cache (batch ${batch_index})"
            echo "Published cache batch ${batch_index}: ${batch_file_count} files, ${batch_bytes} bytes."
            batch_index=$((batch_index + 1))
            batch_bytes=0
            batch_file_count=0
          }

          for artifact in "${staged_files[@]}"; do
            artifact_bytes=0
            if [[ -f "$artifact" ]]; then
              artifact_bytes=$(wc -c < "$artifact")
            fi
            if (( artifact_bytes > max_staged_bytes )); then
              echo "Refusing to publish an individual file larger than 40 MB: ${artifact} (${artifact_bytes} bytes)."
              exit 1
            fi
            if (( batch_file_count > 0 && batch_bytes + artifact_bytes > max_staged_bytes )); then
              commit_batch
            fi
            git add -A -- "$artifact"
            batch_bytes=$((batch_bytes + artifact_bytes))
            batch_file_count=$((batch_file_count + 1))
          done
          commit_batch

          for attempt in 1 2 3; do
            # Reproducible training tables stay uncommitted by design. Autostash
            # them while rebasing so concurrent cache jobs can still synchronize.
            if git pull --rebase --autostash origin main; then
              # A concurrent cache writer may have published a newer LSTM
              # backtest while this job was running. Rebuild the compact
              # evaluation after rebasing so the dashboard never combines a
              # new backtest with stale metrics from the pre-rebase checkout.
              python scripts/evaluate_prediction_quality.py
              cp data/cache/lstm/lstm_evaluation.json \
                data/觀察版資料/10_LSTM模型/lstm/lstm_evaluation.json
              git add \
                data/cache/lstm/lstm_evaluation.json \
                data/觀察版資料/10_LSTM模型/lstm/lstm_evaluation.json
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Cache update could not be pushed after 3 attempts."
          exit 1
