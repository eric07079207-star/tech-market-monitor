name: Prediction regression tests
on:
  push:
    paths: ['src/**', 'scripts/**', 'tests/**', 'app.py', 'requirements-research.txt', '.github/workflows/prediction-tests.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', 'tests/**', 'app.py']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt scikit-learn==1.9.1 exchange-calendars==4.13.2
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_check.py
